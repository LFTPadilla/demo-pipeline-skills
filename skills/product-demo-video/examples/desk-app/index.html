<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <title>Desk</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      body { margin: 0; background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }
      #root { position: relative; width: 1280px; height: 720px; overflow: hidden; background: #0f172a; }
      video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .chip, .caption, #map-dock { position: absolute; }
      .chip, .caption { opacity: 0; }
      .chip { top: 16px; left: 50%; transform: translateX(-50%); padding: 8px 14px; border-radius: 8px; background: #0f172acc; color: #f8fafc; font-size: 16px; font-weight: 700; letter-spacing: 0.08em; }
      .caption { left: 40px; bottom: 28px; width: max-content; max-width: 680px; padding: 10px 14px; border-radius: 10px; background: #0f172af2; color: #f8fafc; font-size: 22px; font-weight: 650; }
      #map-dock { left: 0; top: 0; width: 240px; opacity: 0; z-index: 4; }
      #map-panel { background: rgba(15, 23, 42, 0.94); border-radius: 12px; padding: 10px 12px 8px; }
      .map-title { font-size: 12px; letter-spacing: 0.08em; font-weight: 700; color: #94a3b8; margin-bottom: 6px; }
      .step { display: flex; align-items: center; gap: 8px; height: 26px; font-size: 16px; font-weight: 750; color: #94a3b8; white-space: nowrap; }
      .step i { font-style: normal; width: 16px; color: #1d4ed8; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1280" data-height="720" data-duration="15.261">
      <video id="ui" class="clip" src="out/ui.mp4" muted playsinline data-start="0" data-duration="15.261" data-track-index="0"></video>
      <div id="chip-A" class="chip">01  Inbox</div>
      <div id="chip-B" class="chip">02  Reply</div>
      <div id="cap-A1" class="caption">Every task shows a priority, so urgent work stands out.</div>
      <div id="cap-A2" class="caption">Open a task to read the full note.</div>
      <div id="cap-B1" class="caption">Write a reply, then send it from this screen.</div>
    <div id="map-dock">
      <div id="map-panel">
        <div class="map-title">Desk flow</div>
      <div class="step" id="step-inbox"><i>1</i><span>Inbox</span></div>
      <div class="step" id="step-open"><i>2</i><span>Open</span></div>
      <div class="step" id="step-reply"><i>3</i><span>Reply</span></div>
      </div>
    </div>
      <audio id="vo-A1" src="voice/audio/A.1.wav" data-start="1.2" data-duration="4.2" data-track-index="1" data-volume="1"></audio>
      <audio id="vo-A2" src="voice/audio/A.2.wav" data-start="5.96" data-duration="3.36" data-track-index="2" data-volume="1"></audio>
      <audio id="vo-B1" src="voice/audio/B.1.wav" data-start="10.981" data-duration="3.78" data-track-index="3" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set("#chip-A", { opacity: 1 }, 0);
      tl.set("#chip-A", { opacity: 0 }, 9.732);
      tl.set("#chip-B", { opacity: 1 }, 9.732);
      tl.set("#chip-B", { opacity: 0 }, 15.161);
      tl.set("#cap-A1", { opacity: 1 }, 1.2);
      tl.set("#cap-A1", { opacity: 0 }, 5.4);
      tl.set("#cap-A2", { opacity: 1 }, 5.96);
      tl.set("#cap-A2", { opacity: 0 }, 9.32);
      tl.set("#cap-B1", { opacity: 1 }, 10.981);
      tl.set("#cap-B1", { opacity: 0 }, 14.761);
      tl.set("#map-dock", { opacity: 0 }, 0);
      tl.set("#map-dock", { x: 1024, y: 566, opacity: 1 }, 1.2);
      tl.set("#step-inbox", { opacity: 1 }, 1.2);
      tl.set("#step-inbox span", { color: "#f8fafc" }, 1.2);
      tl.set("#step-open", { opacity: 0.4 }, 1.2);
      tl.set("#step-open span", { color: "#94a3b8" }, 1.2);
      tl.set("#step-reply", { opacity: 0.4 }, 1.2);
      tl.set("#step-reply span", { color: "#94a3b8" }, 1.2);
      tl.set("#map-dock", { opacity: 0 }, 5.4);
      tl.set("#map-dock", { x: 1024, y: 566, opacity: 1 }, 5.96);
      tl.set("#step-inbox", { opacity: 0.4 }, 5.96);
      tl.set("#step-inbox span", { color: "#94a3b8" }, 5.96);
      tl.set("#step-open", { opacity: 1 }, 5.96);
      tl.set("#step-open span", { color: "#f8fafc" }, 5.96);
      tl.set("#step-reply", { opacity: 0.4 }, 5.96);
      tl.set("#step-reply span", { color: "#94a3b8" }, 5.96);
      tl.set("#map-dock", { opacity: 0 }, 9.32);
      tl.set("#map-dock", { x: 1024, y: 16, opacity: 1 }, 10.981);
      tl.set("#step-inbox", { opacity: 0.4 }, 10.981);
      tl.set("#step-inbox span", { color: "#94a3b8" }, 10.981);
      tl.set("#step-open", { opacity: 0.4 }, 10.981);
      tl.set("#step-open span", { color: "#94a3b8" }, 10.981);
      tl.set("#step-reply", { opacity: 1 }, 10.981);
      tl.set("#step-reply span", { color: "#f8fafc" }, 10.981);
      tl.set("#map-dock", { opacity: 0 }, 14.761);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
